<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>💜 Our Love Story</title>

<style>
body{
  margin:0;
  font-family:Arial;
  overflow:hidden;
  color:white;
  background:linear-gradient(135deg,#6a5acd,#b78cff,#ffb6ff);
  background-size:400% 400%;
  animation:bg 10s infinite;
}

@keyframes bg{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

.page{
  display:none;
  height:100vh;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  text-align:center;
  padding:20px;
  background:rgba(0,0,0,0.3);
  backdrop-filter:blur(10px);
}

.active{display:flex;}

button{
  padding:12px 18px;
  margin:6px;
  border:none;
  border-radius:25px;
  background:#b78cff;
  color:white;
  font-weight:bold;
}

input{
  padding:10px;
  width:80%;
  border-radius:10px;
}

.chat-msg{
  background:#dcf8c6;
  color:black;
  padding:10px;
  margin:6px;
  border-radius:10px;
  max-width:80%;
}

/* envelope */
.envelope{
  width:220px;
  height:140px;
  background:#e3c08f;
  position:relative;
  border-radius:10px;
}
.envelope:before{
  content:"";
  position:absolute;
  border-left:110px solid transparent;
  border-right:110px solid transparent;
  border-top:80px solid #caa06a;
}

/* popup */
.popup{
  display:none;
  position:fixed;
  width:100%;
  height:100%;
  top:0;
  left:0;
  background:rgba(0,0,0,0.92);
  justify-content:center;
  align-items:center;
  padding:10px;
}

/* letter */
.letter{
  background:#f6e7c1;
  color:#3b2f2f;
  padding:25px;
  width:92%;
  max-width:520px;
  height:88vh;
  overflow-y:auto;
  border-radius:16px;
  line-height:1.9;
  font-size:15px;
  white-space:pre-wrap;
}
</style>
</head>

<body>

<!-- PAGE 1 -->
<div class="page active" id="p1">
  <h1>💜 A Story Begins</h1>
  <button onclick="next()">Start</button>
</div>

<!-- PAGE 2 -->
<div class="page" id="p2">
  <h2>Password</h2>
  <input id="pass">
  <button onclick="check()">Unlock</button>
</div>

<!-- PAGE 3 -->
<div class="page" id="p3">
  <h2>Countdown</h2>
  <div id="timer"></div>
  <button onclick="next()">Next</button>
</div>

<!-- PAGE 4 -->
<div class="page" id="p4">
  <h2>Song 1</h2>
  <iframe width="300" height="200"
  src="https://www.youtube.com/embed/rZYhjdqzQbM"></iframe>
  <button onclick="next()">Next</button>
</div>

<!-- PAGE 5 -->
<div class="page" id="p5">
  <h2>Favourite Thing</h2>
  <button onclick="alert('Kinder Joy 🍫')">Answer</button>
  <button onclick="next()">Next</button>
</div>

<!-- PAGE 6 -->
<div class="page" id="p6">
  <h2>Chat Memories</h2>
  <button onclick="chat()">Start Chat</button>
  <div id="chat"></div>
  <button onclick="next()">Next</button>
</div>

<!-- PAGE 7 LETTER -->
<div class="page" id="p7">
  <h2>💌 Letter</h2>

  <div class="envelope"></div>
  <button onclick="openLetter()">Open 💌</button>

  <div class="popup" id="pop">
    <div class="letter">
FULL LOVE LETTER (your same text remains here unchanged)
    </div>
  </div>
</div>

<!-- PAGE 8 - SECOND SONG (FIXED INSIDE BODY) -->
<div class="page" id="p8">
  <h2>💫 The Song I wanna feel with you</h2>

  <iframe width="300" height="200"
  src="https://www.youtube.com/embed/5PuYFzMTFOY"></iframe>

  <p>i have been imagining this moment with you 🤍</p>

  <button onclick="next()">Next</button>
</div>

<!-- PAGE 9 -->
<div class="page" id="p9">
  <h1>💍 Will you stay forever?</h1>
  <button onclick="alert('YES 🤍💍')">YES</button>
  <button onclick="alert('NO 💔')">NO</button>
</div>

<!-- PAGE 10 -->
<div class="page" id="p10">
  <h1>💜 The End</h1>
</div>

<script>

let c=1;
function next(){
  c++; if(c>10)c=10;
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById("p"+c).classList.add('active');
}

function check(){
  if(pass.value==="01032026") next();
}

/* CHAT */
async function chat(){
  let box=document.getElementById("chat");
  box.innerHTML="";

  function add(t,s){
    let d=document.createElement("div");
    d.className="chat-msg";
    d.style.marginLeft=s?"auto":"0";
    d.innerText=t;
    box.appendChild(d);
  }

  add("💗 hi iphone",0);
  await new Promise(r=>setTimeout(r,800));
  add("❤️ hi",1);
  await new Promise(r=>setTimeout(r,800));
  add("💗 iloveyou",0);
  await new Promise(r=>setTimeout(r,800));
  add("❤️ love you more",1);
}

/* LETTER */
function openLetter(){
  pop.style.display="flex";
}

/* COUNTDOWN */
let t=new Date("2026-03-01").getTime();
setInterval(()=>{
  let now=new Date().getTime();
  document.getElementById("timer").innerText =
  Math.floor((t-now)/(1000*60*60*24))+" days left 💜";
},1000);

</script>

</body>
</html>
